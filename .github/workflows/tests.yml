name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env for tests
        run: |
          echo "MODEL_PATH=ml/saved_model/model.joblib" >> .env
          echo "METADATA_PATH=ml/saved_model/metadata.json" >> .env
          echo "LOG_LEVEL=INFO" >> .env
          echo "MAX_BATCH_SIZE=100" >> .env
          echo "API_TITLE=ML Prediction API" >> .env
          echo "API_KEY=${{ secrets.API_KEY }}" >> .env

      - name: Run unit tests
        run: python -m pytest tests/ --ignore=tests/test_integration.py -v